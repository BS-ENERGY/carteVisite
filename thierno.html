<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thierno Sidy BAH - BS-Energy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#121212; color:#e0e0e0; font-family:'Montserrat',sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
    .card { max-width:380px; background:#1a1a1a; border-radius:20px; padding:35px 25px; text-align:center; box-shadow:0 12px 35px rgba(0,0,0,0.6); position:relative; }
    .logo { width:120px; height:120px; border-radius:50%; object-fit:contain; margin:20px auto; display:block; border:3px solid #81c784; }
    .company { font-size:34px; font-weight:700; color:#d32f2f; margin:15px 0; letter-spacing:1px; }
    .name { font-size:26px; font-weight:600; color:#ffffff; margin:6px 0; }
    .title { font-size:18px; color:#bbbbbb; margin-bottom:28px; font-weight:500; }
    .contact { font-size:16px; line-height:2.1; }
    .contact a { color:#81c784; text-decoration:none; font-weight:600; transition:color 0.3s; }
    .contact a:hover { color:#66bb6a; }
    .location { margin-top:22px; font-size:18px; color:#81c784; font-weight:600; }
    .tagline { position:absolute; bottom:18px; left:0; right:0; font-size:15px; color:#81c784; font-style:italic; opacity:0.9; }
    .badge { position:absolute; top:18px; right:18px; background:#d32f2f; color:white; padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:0.5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">SALON PARIS 2025</div>
    <img src="logoBSEnergyOfficiel.png" alt="Logo BS-Energy" class="logo">
    <h1 class="company">BS-ENERGY</h1>
    <h2 class="name">Thierno Sidy BAH</h2>
    <p class="title">Directeur Adjoint</p>
    <div class="contact">
      <div>Website: <a href="https://bs-energygn.vercel.app" target="_blank">bs-energygn.vercel.app</a></div>
      <div>Email: <a href="mailto:bsenergy.gn@gmail.com">bsenergy.gn@gmail.com</a></div>
      <div>Phone: <a href="tel:+33616767011">+33 6 16 76 70 11</a></div>
    </div>
    <div class="location">Location: Conakry – Ratoma</div>
    <div class="tagline">Énergie renouvelable, notre passion</div>
  </div>
</body>
</html>
